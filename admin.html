<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panou administrator</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:linear-gradient(135deg,#2b060b,#180306);min-height:100vh}</style></head>
<body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-5xl mx-auto rounded-3xl overflow-hidden bg-stone-900/90 border border-red-900/40 shadow-2xl"><header class="p-6 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 flex justify-between gap-3"><div><h1 class="text-xl md:text-2xl font-bold">Panou administrator - Facturi</h1><p class="text-xs text-red-200/80 mt-1">Solicitări active și atașare documente PDF</p></div><div class="flex gap-2"><a href="admin-istoric.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Istoric</a><a href="index.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Solicitări</a></div></header><section id="state" class="p-6"></section><section id="app" class="hidden"><div class="p-6 flex justify-between border-y border-red-900/30"><span id="identity" class="text-sm text-stone-300"></span><button id="logout" class="text-xs font-bold text-red-300">Deconectare</button></div><div class="p-6"><p id="count" class="mb-4 text-xs font-bold text-red-200"></p><div id="list" class="space-y-4"></div></div></section></main>
<script>
const cfg=window.SUPABASE_CONFIG||{},ready=cfg.url&&cfg.publishableKey&&!cfg.url.includes('YOUR_'),$=id=>document.getElementById(id);let sb,loadVersion=0;const lei=v=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
function state(t,c='amber'){const p=document.createElement('p');p.textContent=t;p.className=`p-4 rounded-xl text-sm bg-${c}-950 border border-${c}-800`;$('state').replaceChildren(p)}
async function openPdf(path){const {data,error}=await sb.storage.from('invoices').createSignedUrl(path,60);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
function docsFor(x){return x.invoice_documents?.length?x.invoice_documents:(x.pdf_path?[{storage_path:x.pdf_path,file_name:'Factura PDF'}]:[])}
async function upload(x,input,button){const files=[...input.files];if(!files.length)return alert('Selectează unul sau mai multe fișiere PDF.');if(files.some(f=>f.type!=='application/pdf'))return alert('Sunt acceptate numai fișiere PDF.');if(files.some(f=>f.size>10*1024*1024))return alert('Fiecare PDF trebuie să aibă maximum 10 MB.');button.disabled=true;button.textContent='Se încarcă…';const errors=[];for(let i=0;i<files.length;i++){const f=files[i],name=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${x.id}/${Date.now()}-${i}-${name}`;const {error:storageError}=await sb.storage.from('invoices').upload(path,f,{contentType:'application/pdf'});if(storageError){errors.push(`${f.name}: ${storageError.message}`);continue}const {error:rowError}=await sb.from('invoice_documents').insert({invoice_id:x.id,storage_path:path,file_name:f.name,uploaded_by:(await sb.auth.getUser()).data.user.id});if(rowError){errors.push(`${f.name}: ${rowError.message}`);await sb.storage.from('invoices').remove([path])}}const {error:statusError}=await sb.from('invoices').update({status:'FINALIZATA'}).eq('id',x.id);if(statusError)errors.push(statusError.message);if(errors.length)alert(`Unele documente nu au putut fi atașate:\n${errors.join('\n')}`);await load()}
function docButtons(x){const wrap=document.createElement('div');wrap.className='flex flex-wrap gap-2';const docs=docsFor(x);if(!docs.length){const note=document.createElement('span');note.className='text-xs text-stone-500';note.textContent='Niciun PDF atașat încă';wrap.append(note)}docs.forEach((doc,i)=>{const b=document.createElement('button');b.className='text-xs font-bold text-red-300 bg-stone-800 rounded-xl border border-stone-700 px-3 py-2';b.textContent=`PDF ${i+1}: ${doc.file_name||'Deschide'}`;b.onclick=()=>openPdf(doc.storage_path);wrap.append(b)});return wrap}
function card(x){const a=document.createElement('article');a.className='p-5 rounded-2xl bg-stone-950/70 border border-stone-800 space-y-3';const h=document.createElement('h2');h.className='font-bold text-red-400';h.textContent=`${x.campionat}: ${x.echipa1} vs ${x.echipa2}`;const d=document.createElement('p');d.className='text-xs text-stone-400';d.textContent=`Data meci: ${x.data_meci} · Cerere: ${new Date(x.created_at).toLocaleString('ro-RO')}`;const info=document.createElement('div');info.className='grid md:grid-cols-3 gap-3 text-xs p-3 rounded-xl bg-stone-900 border border-stone-800';[['Arbitru',`${x.nume_arbitru} (${x.functie})\nTel: ${x.telefon_arbitru}`],['Plată & sume',`${x.metoda_plata} · Brut: ${lei(x.suma_totala)} lei\nNet: ${lei(x.suma_neta)} lei`],['Date fiscale',`CUI: ${x.cui}\nIBAN: ${x.iban_arbitru||'Nespecificat'}`]].forEach(([k,v])=>{const b=document.createElement('div'),l=document.createElement('span'),q=document.createElement('span');l.className='block text-stone-500';l.textContent=k;q.className='font-semibold whitespace-pre-line';q.textContent=v;b.append(l,q);info.append(b)});const actions=document.createElement('div');actions.className='flex flex-col md:flex-row justify-between gap-3 md:items-center';actions.append(docButtons(x));const controls=document.createElement('div');controls.className='flex gap-2 items-center';const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.multiple=true;i.className='text-xs text-stone-400 max-w-56';const b=document.createElement('button');b.textContent='Atașează PDF-uri & finalizează';b.className='text-xs font-bold bg-red-800 rounded-xl px-4 py-2 whitespace-nowrap';b.onclick=()=>upload(x,i,b);controls.append(i,b);actions.append(controls);a.append(h,d,info,actions);return a}
async function load(){const version=++loadVersion,l=$('list'),{data,error}=await sb.from('invoices').select('*,invoice_documents(*)').eq('status','IN_PROCESARE').order('created_at',{ascending:false});if(version!==loadVersion)return;l.replaceChildren();if(error){l.textContent=`Eroare: ${error.message}`;return}$('count').textContent=`Solicitări active: ${data.length}`;if(!data.length){l.textContent='Nu există nicio solicitare activă.';return}data.forEach(x=>l.append(card(x)))}
async function screen(session){$('app').classList.add('hidden');if(!session)return state('Autentifică-te mai întâi din pagina de solicitări.');const {data,error}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(error||data?.role!=='admin')return state('Acest cont nu are drepturi de administrator.','red');$('state').replaceChildren();$('identity').textContent=session.user.email;$('app').classList.remove('hidden');load()}
async function init(){if(!ready)return state('Aplicația nu este configurată încă.');sb=window.supabase.createClient(cfg.url,cfg.publishableKey);$('logout').onclick=()=>sb.auth.signOut();const {data:{session}}=await sb.auth.getSession();screen(session);sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>screen(s),0))}init();
</script></body></html>
