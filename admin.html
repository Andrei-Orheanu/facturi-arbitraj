<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrare</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body class="bg-red-950 text-white p-6"><main class="max-w-5xl mx-auto bg-stone-900 rounded-2xl p-6"><h1 class="text-xl font-bold">Panou administrator - Facturi</h1><p><a href="admin-istoric.html">Istoric</a> · <a href="index.html">Solicitări</a></p><div id="out" class="mt-6"></div></main><script>
const c=window.SUPABASE_CONFIG,$=x=>document.getElementById(x),sb=window.supabase.createClient(c.url,c.publishableKey),m=x=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2}).format(x||0);async function pdf(p){const{data,error}=await sb.storage.from('invoices').createSignedUrl(p,60);if(error)return alert(error.message);open(data.signedUrl)}async function upload(x,i,b){const fs=[...i.files];if(!fs.length)return alert('Selectează PDF-uri.');b.disabled=true;for(const f of fs){const p=`${x.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,u=await sb.storage.from('invoices').upload(p,f,{contentType:'application/pdf'});if(u.error)return alert(u.error.message);const user=(await sb.auth.getUser()).data.user,r=await sb.from('invoice_documents').insert({invoice_id:x.id,storage_path:p,file_name:f.name,uploaded_by:user.id});if(r.error)return alert(r.error.message)}await sb.from('invoices').update({status:'FINALIZATA'}).eq('id',x.id);load()}function card(x){const a=document.createElement('article');a.className='bg-stone-950 p-4 rounded-xl mb-3';a.innerHTML=`<b>${x.nume_arbitru} · ${m(x.suma_totala)} lei</b><p>Beneficiar: ${x.beneficiar_servicii||'Nespecificat'} · CUI: ${x.cui}</p>`;(x.invoice_entries||[]).forEach(e=>{const p=document.createElement('p');p.textContent=`${e.campionat}: ${e.echipa1} vs ${e.echipa2} · ${e.functie} · ${m(e.suma_totala)} lei`;a.append(p)});(x.invoice_documents||[]).forEach((d,n)=>{const b=document.createElement('button');b.textContent=`PDF ${n+1}`;b.onclick=()=>pdf(d.storage_path);a.append(b)});const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.multiple=true;const b=document.createElement('button');b.textContent='Atașează PDF-uri & finalizează';b.onclick=()=>upload(x,i,b);a.append(i,b);return a}async function load(){const s=await sb.auth.getUser(),p=await sb.from('profiles').select('role').eq('id',s.data.user.id).single();if(p.data?.role!=='admin')return $('out').textContent='Fără drepturi administrator.';const r=await sb.from('invoices').select('*,invoice_entries(*),invoice_documents(*)').eq('status','IN_PROCESARE');$('out').replaceChildren();if(r.error)return $('out').textContent=r.error.message;if(!r.data.length)return $('out').textContent='Nu există solicitări active.';r.data.forEach(x=>$('out').append(card(x)))}load();
</script></body></html>
