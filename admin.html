<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panou Administrator - Facturi</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:linear-gradient(135deg,#2b060b,#180306);min-height:100vh}</style></head>
<body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-5xl mx-auto rounded-3xl overflow-hidden bg-stone-900/90 border border-red-900/40 shadow-2xl"><header class="p-6 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 flex justify-between gap-3"><div><h1 class="text-xl md:text-2xl font-bold">Panou administrator - Facturi</h1><p class="text-xs text-red-200/80 mt-1">Gestiune solicitări și atașare facturi PDF</p></div><a href="index.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Solicitări</a></header><section id="state" class="p-6"></section><section id="app" class="hidden"><div class="p-6 flex justify-between border-y border-red-900/30"><span id="identity" class="text-sm text-stone-300"></span><button id="logout" class="text-xs font-bold text-red-300">Deconectare</button></div><div class="p-6"><p id="count" class="mb-4 text-xs font-bold text-red-200"></p><div id="list" class="space-y-4"></div></div></section></main>
<script>
const cfg=window.SUPABASE_CONFIG||{},ready=cfg.url&&cfg.publishableKey&&!cfg.url.includes('YOUR_'),$=id=>document.getElementById(id);let sb;const lei=v=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
function state(t,color='amber'){const p=document.createElement('p');p.textContent=t;p.className=`p-4 rounded-xl text-sm bg-${color}-950 border border-${color}-800`;$('state').replaceChildren(p)}
async function getPdf(path){const {data,error}=await sb.storage.from('invoices').createSignedUrl(path,60);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
async function upload(x,input,button){const f=input.files[0];if(!f)return alert('Selectează un fișier PDF mai întâi.');if(f.type!=='application/pdf')return alert('Este acceptat numai formatul PDF.');if(f.size>10*1024*1024)return alert('PDF-ul depășește limita de 10 MB.');button.disabled=true;button.textContent='Se încarcă…';const path=`${x.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,{error:up}=await sb.storage.from('invoices').upload(path,f,{contentType:'application/pdf'});if(up){alert(up.message);return load()}const {error}=await sb.from('invoices').update({pdf_path:path,status:'FINALIZATA'}).eq('id',x.id);if(error){alert(`PDF încărcat, dar solicitarea nu a fost actualizată: ${error.message}`);return load()}if(x.pdf_path)await sb.storage.from('invoices').remove([x.pdf_path]);load()}
function card(x){const a=document.createElement('article');a.className='p-5 rounded-2xl bg-stone-950/70 border border-stone-800 space-y-3';const h=document.createElement('h2');h.className='font-bold text-red-400';h.textContent=`${x.campionat}: ${x.echipa1} vs ${x.echipa2}`;const d=document.createElement('p');d.className='text-xs text-stone-400';d.textContent=`Data meci: ${x.data_meci} · Cerere: ${new Date(x.created_at).toLocaleString('ro-RO')}`;const info=document.createElement('div');info.className='grid md:grid-cols-3 gap-3 text-xs p-3 rounded-xl bg-stone-900 border border-stone-800';[['Arbitru',`${x.nume_arbitru} (${x.functie})\nTel: ${x.telefon_arbitru}`],['Plată & sume',`${x.metoda_plata} · Brut: ${lei(x.suma_totala)} lei\nNet: ${lei(x.suma_neta)} lei`],['Date fiscale',`CUI: ${x.cui}\nIBAN: ${x.iban_arbitru||'Nespecificat'}`]].forEach(([k,v])=>{const b=document.createElement('div'),l=document.createElement('span'),q=document.createElement('span');l.className='block text-stone-500';l.textContent=k;q.className='font-semibold whitespace-pre-line';q.textContent=v;b.append(l,q);info.append(b)});const actions=document.createElement('div');actions.className='flex flex-col md:flex-row justify-between gap-3 md:items-center';if(x.pdf_path){const b=document.createElement('button');b.className='text-xs font-bold text-red-300 bg-stone-800 rounded-xl border border-stone-700 px-3 py-2';b.textContent='Vezi PDF încărcat';b.onclick=()=>getPdf(x.pdf_path);actions.append(b)}else{const p=document.createElement('span');p.className='text-xs text-stone-500';p.textContent='Niciun PDF atașat încă';actions.append(p)}const controls=document.createElement('div');controls.className='flex gap-2 items-center';const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.className='text-xs text-stone-400 max-w-52';const b=document.createElement('button');b.textContent='Atașează PDF & finalizează';b.className='text-xs font-bold bg-red-800 rounded-xl px-4 py-2 whitespace-nowrap';b.onclick=()=>upload(x,i,b);controls.append(i,b);actions.append(controls);a.append(h,d,info,actions);return a}
async function load(){const l=$('list');l.replaceChildren();const {data,error}=await sb.from('invoices').select('*').order('created_at',{ascending:false});if(error){l.textContent=`Eroare: ${error.message}`;return}$('count').textContent=`Total solicitări: ${data.length}`;if(!data.length){l.textContent='Nu există nicio solicitare înregistrată.';return}data.forEach(x=>l.append(card(x)))}
async function screen(session){$('app').classList.add('hidden');if(!session)return state('Autentifică-te mai întâi din pagina de solicitări.');const {data,error}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(error||data?.role!=='admin')return state('Acest cont nu are drepturi de administrator.','red');$('state').replaceChildren();$('identity').textContent=session.user.email;$('app').classList.remove('hidden');load()}
async function init(){if(!ready)return state('Aplicația nu este configurată încă. Completează supabase-config.js conform README.md.');sb=window.supabase.createClient(cfg.url,cfg.publishableKey);$('logout').onclick=()=>sb.auth.signOut();const {data:{session}}=await sb.auth.getSession();screen(session);sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>screen(s),0))}init();
</script></body></html>
