<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil | Facturi Arbitraj</title>
  <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4a0e17">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
  <style>body{background:linear-gradient(135deg,#2b060b,#120204);min-height:100vh}</style>
</head>
<body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-2xl mx-auto overflow-hidden rounded-3xl border border-red-900/50 bg-stone-900 shadow-2xl">
  <header class="flex flex-col gap-4 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 p-6 md:flex-row md:items-start md:justify-between"><div><h1 class="text-xl font-bold">Profil</h1><p class="mt-1 text-sm text-red-200/80">Datele salvate completează automat o solicitare nouă. Le poți modifica pentru fiecare factură.</p></div><a href="index.html" class="h-fit rounded-lg border border-red-700 px-3 py-2 text-xs font-bold">Solicitare nouă</a></header>
  <section class="p-6"><p id="state" class="mb-4 text-sm text-stone-300"></p><form id="profileForm" class="hidden space-y-5"><div class="grid gap-3 md:grid-cols-2"><label class="space-y-1 text-sm"><span>Nume arbitru / solicitant</span><input id="nume" class="w-full rounded-lg bg-stone-800 p-3"></label><label class="space-y-1 text-sm"><span>Telefon</span><input id="telefon" class="w-full rounded-lg bg-stone-800 p-3"></label><label class="space-y-1 text-sm md:col-span-2"><span>Beneficiarul serviciilor de arbitraj</span><input id="beneficiar" class="w-full rounded-lg bg-stone-800 p-3"></label><label class="space-y-1 text-sm"><span>CUI / CIF club</span><input id="cui" class="w-full rounded-lg bg-stone-800 p-3"></label><fieldset class="space-y-2 text-sm"><legend>Metodă de plată preferată</legend><label class="mr-4"><input type="radio" name="plata" value="CASH" checked> Numerar</label><label><input type="radio" name="plata" value="BANK"> Transfer bancar</label></fieldset></div><label id="ibanRow" class="hidden space-y-1 text-sm"><span>IBAN pentru transfer bancar</span><input id="iban" class="w-full rounded-lg bg-stone-800 p-3"></label><p id="message" class="text-sm"></p><div class="flex flex-wrap gap-3"><button class="rounded-lg bg-red-800 px-4 py-3 font-bold">Salvează profilul</button><a href="istoric.html" class="rounded-lg border border-stone-600 px-4 py-3 font-bold">Istoric facturi</a><button id="logout" type="button" class="rounded-lg border border-stone-600 px-4 py-3 font-bold">Deconectare</button></div></form></section>
</main><script>
const cfg=window.SUPABASE_CONFIG||{},$=id=>document.getElementById(id);let sb,user;const optional=id=>$(id).value.trim()||null;function payment(){const bank=document.querySelector('[name="plata"][value="BANK"]:checked'),row=$('ibanRow');row.classList.toggle('hidden',!bank);$('iban').required=!!bank}async function show(session){user=session?.user;if(!user){$('state').innerHTML='Autentifică-te din <a href="index.html" class="underline text-red-300">pagina solicitărilor</a> pentru a-ți edita profilul.';$('profileForm').classList.add('hidden');return}$('profileForm').classList.remove('hidden');const {data,error}=await sb.from('profiles').select('nume,telefon,beneficiar_servicii,cui,iban,metoda_plata_preferata').eq('id',user.id).maybeSingle();if(error)return $('state').textContent=`Eroare: ${error.message}`;$('nume').value=data?.nume||'';$('telefon').value=data?.telefon||'';$('beneficiar').value=data?.beneficiar_servicii||'';$('cui').value=data?.cui||'';$('iban').value=data?.iban||'';const selected=document.querySelector(`[name="plata"][value="${data?.metoda_plata_preferata||'CASH'}"]`);if(selected)selected.checked=true;payment();$('state').textContent=''}async function init(){if(!cfg.url||!cfg.publishableKey)return $('state').textContent='Aplicația nu este configurată.';sb=window.supabase.createClient(cfg.url,cfg.publishableKey);document.querySelectorAll('[name="plata"]').forEach(input=>input.onchange=payment);$('logout').onclick=()=>sb.auth.signOut();$('profileForm').onsubmit=async event=>{event.preventDefault();const pay=document.querySelector('[name="plata"]:checked').value;if(pay==='BANK'&&!$('iban').value.trim())return $('message').textContent='Introdu IBAN-ul pentru transfer bancar.';const {error}=await sb.from('profiles').update({nume:optional('nume'),telefon:optional('telefon'),beneficiar_servicii:optional('beneficiar'),cui:optional('cui'),iban:pay==='BANK'?optional('iban'):null,metoda_plata_preferata:pay}).eq('id',user.id);$('message').className=`text-sm ${error?'text-amber-200':'text-emerald-300'}`;$('message').textContent=error?`Profilul nu a putut fi salvat: ${error.message}`:'Profil salvat. Aceste date vor completa automat solicitările noi.'};const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_event,next)=>setTimeout(()=>show(next),0))}init();
</script></body></html>
