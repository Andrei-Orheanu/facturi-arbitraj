<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Istoric administrator</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:linear-gradient(135deg,#2b060b,#180306);min-height:100vh}</style></head><body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-5xl mx-auto rounded-3xl overflow-hidden bg-stone-900/90 border border-red-900/40 shadow-2xl"><header class="p-6 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 flex justify-between"><div><h1 class="text-xl font-bold">Istoric administrator</h1><p class="text-xs text-red-200/80">Solicitări finalizate și documente PDF.</p></div><a href="admin.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Solicitări active</a></header><section class="p-6"><p id="state" class="text-sm text-stone-300 mb-4"></p><div id="list" class="space-y-4"></div></section></main><script>
const cfg=window.SUPABASE_CONFIG||{},$=id=>document.getElementById(id),ready=cfg.url&&cfg.publishableKey&&!cfg.url.includes('YOUR_');let sb,version=0;const lei=v=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
async function pdf(p){const {data,error}=await sb.storage.from('invoices').createSignedUrl(p,60);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}function docs(x){return x.invoice_documents?.length?x.invoice_documents:(x.pdf_path?[{storage_path:x.pdf_path,file_name:'Factura PDF'}]:[])}function card(x){const a=document.createElement('article'),h=document.createElement('h2'),m=document.createElement('p'),d=document.createElement('p'),box=document.createElement('div');a.className='p-5 rounded-2xl bg-stone-950 border border-stone-800';h.className='font-bold text-red-400';h.textContent=`${x.campionat}: ${x.echipa1} vs ${x.echipa2}`;m.className='text-xs text-stone-400 mt-1';m.textContent=`${x.nume_arbitru} (${x.functie}) · ${x.data_meci}`;d.className='text-xs text-stone-300 mt-2';d.textContent=`${x.metoda_plata} · Brut: ${lei(x.suma_totala)} lei · Net: ${lei(x.suma_neta)} lei`;box.className='mt-3 flex flex-wrap gap-2';docs(x).forEach((doc,i)=>{const b=document.createElement('button');b.className='text-xs font-bold text-red-300 bg-stone-800 border border-stone-700 rounded-xl px-3 py-2';b.textContent=`PDF ${i+1}: ${doc.file_name||'Deschide'}`;b.onclick=()=>pdf(doc.storage_path);box.append(b)});a.append(h,m,d,box);return a}async function load(){const v=++version,{data,error}=await sb.from('invoices').select('*,invoice_documents(*)').eq('status','FINALIZATA').order('created_at',{ascending:false});if(v!==version)return;$('list').replaceChildren();if(error)return $('state').textContent=`Eroare: ${error.message}`;$('state').textContent=data.length?`Facturi finalizate: ${data.length}`:'Nu există facturi finalizate.';data.forEach(x=>$('list').append(card(x)))}async function show(s){if(!s){$('state').textContent='Autentifică-te din panoul administrator.';return}const {data,error}=await sb.from('profiles').select('role').eq('id',s.user.id).single();if(error||data?.role!=='admin'){ $('state').textContent='Acest cont nu are drepturi de administrator.';return}load()}async function init(){if(!ready){$('state').textContent='Aplicația nu este configurată.';return}sb=window.supabase.createClient(cfg.url,cfg.publishableKey);const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>show(s),0))}init();
</script></body></html>
