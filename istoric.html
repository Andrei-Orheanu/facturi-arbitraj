<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Istoric facturi</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:linear-gradient(135deg,#4a0e17,#2b060b);min-height:100vh}</style></head>
<body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-2xl mx-auto rounded-3xl overflow-hidden bg-stone-900/90 border border-red-900/40 shadow-2xl"><header class="p-6 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 flex justify-between"><div><h1 class="text-xl font-bold">Istoric facturi</h1><p class="text-sm text-red-200/80">Facturi finalizate și documente disponibile.</p></div><a href="index.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Solicitări active</a></header><section class="p-6"><p id="state" class="text-sm text-stone-300"></p><div id="list" class="space-y-3"></div></section></main>
<script>
const cfg=window.SUPABASE_CONFIG||{}, $=id=>document.getElementById(id),ready=cfg.url&&cfg.publishableKey&&!cfg.url.includes('YOUR_');let sb,user,version=0;const lei=v=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
async function pdf(path){const {data,error}=await sb.storage.from('invoices').createSignedUrl(path,60);if(error)return alert(`Document indisponibil: ${error.message}`);window.open(data.signedUrl,'_blank','noopener')}
function card(x){const a=document.createElement('article'),h=document.createElement('p'),m=document.createElement('p'),b=document.createElement('button');a.className='p-4 rounded-xl bg-stone-950 border border-stone-800';h.className='font-bold text-sm';h.textContent=`${x.campionat}: ${x.echipa1} vs ${x.echipa2}`;m.className='text-xs text-stone-400 mt-1';m.textContent=`${x.functie} | Brut: ${lei(x.suma_totala)} lei | Net: ${lei(x.suma_neta)} lei`;a.append(h,m);if(x.pdf_path){b.className='mt-2 text-xs bg-red-700 rounded-lg px-3 py-2 font-bold';b.textContent='Descarcă PDF';b.onclick=()=>pdf(x.pdf_path);a.append(b)}return a}
async function load(){const v=++version,{data,error}=await sb.from('invoices').select('*').eq('user_id',user.id).eq('status','FINALIZATA').order('created_at',{ascending:false});if(v!==version)return;$('list').replaceChildren();if(error)return $('state').textContent=`Eroare: ${error.message}`;$('state').textContent=data.length?'':'Nu ai nicio factură finalizată.';data.forEach(x=>$('list').append(card(x)))}
async function show(session){user=session?.user;if(!user){$('state').innerHTML='Autentifică-te din <a class="text-red-300 underline" href="index.html">pagina solicitărilor</a> pentru a-ți vedea istoricul.';$('list').replaceChildren();return}await load()}
async function init(){if(!ready){$('state').textContent='Aplicația nu este configurată.';return}sb=window.supabase.createClient(cfg.url,cfg.publishableKey);const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>show(s),0))}init();
</script></body></html>
