<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Istoric facturi</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:linear-gradient(135deg,#4a0e17,#2b060b);min-height:100vh}</style></head><body class="p-4 md:p-8 text-slate-100 font-sans"><main class="max-w-3xl mx-auto rounded-3xl overflow-hidden bg-stone-900/90 border border-red-900/40 shadow-2xl"><header class="p-6 bg-gradient-to-r from-red-900 via-red-950 to-stone-900 flex justify-between"><div><h1 class="text-xl font-bold">Istoric facturi</h1><p class="text-sm text-red-200/80">Solicitări finalizate și documente disponibile.</p></div><a href="index.html" class="text-xs h-fit font-bold border border-red-700 rounded-lg p-2">Solicitări</a></header><section class="p-6"><p id="state" class="text-sm text-stone-300 mb-4"></p><div id="list" class="space-y-3"></div></section></main><script>
const cfg=window.SUPABASE_CONFIG||{},$=id=>document.getElementById(id),ready=cfg.url&&cfg.publishableKey&&!cfg.url.includes('YOUR_');let sb,user,version=0;const lei=v=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
async function pdf(p){const {data,error}=await sb.storage.from('invoices').createSignedUrl(p,60);if(error)return alert(`Document indisponibil: ${error.message}`);window.open(data.signedUrl,'_blank','noopener')}function docs(x){return x.invoice_documents?.length?x.invoice_documents:(x.pdf_path?[{storage_path:x.pdf_path,file_name:'Factura PDF'}]:[])}function card(x){const a=document.createElement('article'),h=document.createElement('h2'),m=document.createElement('p'),entries=document.createElement('div'),box=document.createElement('div');a.className='p-4 rounded-xl bg-stone-950 border border-stone-800';h.className='font-bold text-red-300';h.textContent=`Solicitare cu ${(x.invoice_entries||[]).length||1} meci(uri)`;m.className='text-xs text-stone-400 mt-1';m.textContent=`Brut total: ${lei(x.suma_totala)} lei | Net total: ${lei(x.suma_neta)} lei`;entries.className='mt-3 space-y-1 text-sm';(x.invoice_entries?.length?x.invoice_entries:[x]).forEach(e=>{const p=document.createElement('p');p.textContent=`${e.campionat}: ${e.echipa1} vs ${e.echipa2} · ${e.functie} · ${e.data_meci}`;entries.append(p)});box.className='mt-3 flex flex-wrap gap-2';docs(x).forEach((d,i)=>{const b=document.createElement('button');b.className='text-xs bg-red-700 rounded-lg px-3 py-2 font-bold';b.textContent=`Descarcă PDF ${i+1}${d.file_name?`: ${d.file_name}`:''}`;b.onclick=()=>pdf(d.storage_path);box.append(b)});a.append(h,m,entries,box);return a}async function load(){const v=++version,{data,error}=await sb.from('invoices').select('*,invoice_entries(*),invoice_documents(*)').eq('user_id',user.id).eq('status','FINALIZATA').order('created_at',{ascending:false});if(v!==version)return;$('list').replaceChildren();if(error)return $('state').textContent=`Eroare: ${error.message}`;$('state').textContent=data.length?'':'Nu ai nicio factură finalizată.';data.forEach(x=>$('list').append(card(x)))}async function show(s){user=s?.user;if(!user){$('state').innerHTML='Autentifică-te din <a class="text-red-300 underline" href="index.html">pagina solicitărilor</a> pentru a-ți vedea istoricul.';$('list').replaceChildren();return}load()}async function init(){if(!ready){$('state').textContent='Aplicația nu este configurată.';return}sb=window.supabase.createClient(cfg.url,cfg.publishableKey);const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>show(s),0))}init();
</script></body></html>
