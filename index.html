<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitare Factură</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{background:#2b060b;min-height:100vh}</style></head><body class="p-4 text-slate-100"><main class="max-w-3xl mx-auto bg-stone-900 rounded-3xl overflow-hidden"><header class="p-6 bg-red-950 flex justify-between"><div><h1 class="text-xl font-bold">Solicitare Factură Arbitraj</h1><p class="text-sm">Mai multe meciuri într-o solicitare.</p></div><a href="admin.html">Administrare</a></header><section id="auth" class="p-6"><form id="authForm" class="space-y-3"><input id="email" type="email" required placeholder="E-mail" class="w-full p-3 bg-stone-800"><input id="password" type="password" required placeholder="Parolă" class="w-full p-3 bg-stone-800"><button class="p-3 bg-red-800">Intră în cont</button><button id="register" type="button" class="p-3 border">Creează cont</button></form></section><section id="app" class="hidden"><div class="p-4 flex justify-between"><span id="identity"></span><button id="logout">Deconectare</button></div><form id="form" class="p-6 space-y-4"><section class="p-4 bg-stone-950 rounded-xl space-y-3"><b>Date comune</b><div class="grid grid-cols-2 gap-3"><input id="nume" required placeholder="Nume arbitru" class="p-3 bg-stone-800"><input id="telefon" required placeholder="Telefon" class="p-3 bg-stone-800"><select id="tip" class="p-3 bg-stone-800"><option value="ARBITRU">Arbitru</option><option value="AJF">AJF</option></select><input id="cui" required placeholder="CUI / CIF club" class="p-3 bg-stone-800"></div><label><input type="radio" name="plata" value="CASH" checked> Numerar</label><label><input type="radio" name="plata" value="BANK"> Transfer bancar</label><input id="iban" placeholder="IBAN (obligatoriu la transfer)" class="w-full p-3 bg-stone-800"></section><div class="flex justify-between"><b>Meciuri și roluri</b><button id="add" type="button" class="bg-red-800 px-3 py-2">+ Adaugă meci</button></div><div id="entries" class="space-y-3"></div><p>Total net: <b id="net">0,00</b> lei</p><button class="w-full p-4 bg-red-800 font-bold">Trimite solicitarea</button></form></section></main><template id="entry"><article class="entry p-4 bg-stone-950 rounded-xl space-y-2"><button type="button" class="remove text-red-300">Elimină meci</button><div class="grid grid-cols-2 gap-2"><input class="campionat p-2 bg-stone-800" required placeholder="Campionat"><select class="functie p-2 bg-stone-800"><option>Arbitru</option><option>Arbitru Asistent</option></select><input class="echipa1 p-2 bg-stone-800" required placeholder="Echipa gazdă"><input class="echipa2 p-2 bg-stone-800" required placeholder="Echipa oaspete"><input class="data p-2 bg-stone-800" required type="date"><input class="suma p-2 bg-stone-800" required type="number" min="1" step="0.01" placeholder="Sumă brută"></div></article></template><script>
const c=window.SUPABASE_CONFIG||{},$=x=>document.getElementById(x);let sb,u;const m=x=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2}).format(x||0);function add(){const n=$('entry').content.cloneNode(true),e=n.querySelector('.entry');e.querySelector('.remove').onclick=()=>{if($('entries').children.length>1)e.remove();total()};e.querySelector('.suma').oninput=total;$('entries').append(n)}function total(){let t=0;document.querySelectorAll('.suma').forEach(x=>t+=(Number(x.value)||0)*.8-10);$('net').textContent=m(Math.max(0,t))}async function show(s){u=s?.user;$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(u)$('identity').textContent=u.email}async function init(){sb=window.supabase.createClient(c.url,c.publishableKey);add();$('add').onclick=add;$('logout').onclick=()=>sb.auth.signOut();$('authForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)alert(error.message)};$('register').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});alert(error||'Verifică e-mailul.')};$('form').onsubmit=async e=>{e.preventDefault();const pay=document.querySelector('[name=plata]:checked').value,entries=[...document.querySelectorAll('.entry')].map(e=>{const s=Number(e.querySelector('.suma').value);return{campionat:e.querySelector('.campionat').value,echipa1:e.querySelector('.echipa1').value,echipa2:e.querySelector('.echipa2').value,data_meci:e.querySelector('.data').value,functie:e.querySelector('.functie').value,suma_totala:s,suma_neta:s*.8-10}}),gross=entries.reduce((a,x)=>a+x.suma_totala,0),net=entries.reduce((a,x)=>a+x.suma_neta,0);const {data,error}=await sb.from('invoices').insert({user_id:u.id,solicitant_tip:$('tip').value,nume_arbitru:$('nume').value,telefon_arbitru:$('telefon').value,iban_arbitru:pay==='BANK'?$('iban').value:null,cui:$('cui').value,metoda_plata:pay,necesita_chitanta:pay==='CASH',suma_totala:gross,suma_neta:net}).select('id').single();if(error)return alert(error.message);const r=await sb.from('invoice_entries').insert(entries.map(x=>({...x,invoice_id:data.id})));if(r.error)return alert(r.error.message);alert('Solicitarea a fost trimisă.');$('form').reset();$('entries').replaceChildren();add();total()};const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>show(s))}init();
</script></body></html>
